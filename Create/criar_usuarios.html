    <!doctype html>
    <html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login - Listenly</title>
        <link rel="icon" href="/img/logo.png" type="image/png">
    </head>
    <body>
        <h1>Cadastro de usuário</h1>

        <div class="form_criar_usuario">
            <form id="formCadastro" action="#" method="post" onsubmit="return validarFormCreateUser(event)">

            <label for="nome">Digite Seu Nome Compelto:</label><br>
            <input type="text" id="nome" name="nome" required><br><br>


            <label for="email">Digite Seu E-mail:</label><br>
            <input type="email" id="email" name="email" required><br><br>


            <label for="username">Digite Seu Username:</label><br>
            <input type="text" id="username" name="username" required><br><br>


            <label for="senha">Digite Sua Senha:</label><br>
            <input type="password" id="senha" name="senha" required><br><br>


            <label for="senha2">Confirme Sua Senha:</label><br>
            <input type="password" id="senha2" name="senha2" required><br><br>

            <span id="mensagem"></span><br><br>

            <input type="submit" value="Cadastrar">
            </form>
        </div>

        <script type="module">

            // export de Função
            import { validarFormCreateUser } from './Create/validar_form_criarusuario.js';
            import { confirmar_senha } from './Create/confirm_senha.js';

            // Chamando id de formulario
            const form = document.getElementById('formCadastro');

            form.addEventListener('submit', (event) => {
            // Primeiro valida o formulário geral
                if (!validarFormCreateUser(event)) {
                event.preventDefault();
                return;
                }
            // Depois valida se as senhas conferem
                if (!confirmar_senha(event)) {
                event.preventDefault();
                return;
                }
                // Se tudo passar, mensagem de sucesso
                alert('✅ Cadastro válido! (simulação)');
                });
        </script>

    </body>
    </html>
