<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Listenly/Scr/frontend/Pages/Pagamento/pagamento.css">
    <link rel="icon" href="/Listenly/Scr/frontend/Pages/Img/Icons/logo.png">
    <title>Pagamento - Listenly</title>
</head>
<body>
    <div class="estrelas"></div>
    <h1>Pagamento de assinatura</h1>

    <div class="form_pagamento">
        <form action="#" method="get" onsubmit="return validarFormPagamento(event)">

            <label for="nome_cartao">Nome do Dono do Cartão</label>
            <input type="text" id="nome_cartao" name="nome_cartao" placeholder=""><br><br>

            <label for="numero_cartao">Número do Cartão</label>
            <input type="text" id="numero_cartao" name="numero_cartao" maxlength="19" placeholder="0000 0000 0000 0000" required><br><br>

            <label for="validade_cartao">Validade (MM/AA)</label>
            <input type="text" id="validade_cartao" name="validade_cartao" maxlength="5" placeholder="MM/AA" required><br><br>

            <label for="cod_seguranca">Código de Segurança (CVV)</label>
            <input type="text" id="cod_seguranca" name="cod_seguranca" maxlength="4" placeholder="123" required><br><br>
        
            <label for="email">E-mail de Confirmação</label>
            <input type="email" id="email" name="email" placeholder="user@gmail.com"><br><br>

            <input type="submit" value="Pagar">
        
            <span id="Erro" style="color: red; margin-top: 10px; display: block; text-align: center;"></span>
        </form>
    </div>

    <script src="./validar_form_pagamento.js"></script>
    <script src="./pagamento.js"></script>
</body>
</html>
