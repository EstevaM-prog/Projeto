    <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Global typography (padroniza tamanho de fonte) -->
        <link rel="stylesheet" href="../Css/global-typography.css">
        <title>Listenly - Perfil</title>
        <!-- Inclui o CDN do Tailwind CSS para facilitar o estilo -->
        <script src="https://cdn.tailwindcss.com"></script>
        <!-- Carrega a fonte Inter para uma tipografia moderna -->
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
        <!-- Carrega Logo do site -->
        <link rel="icon" href="/Listenly/Scr/frontend/Pages/Img/Icons/logo.png" type="image/png">

        
        <style> 
            body {
                font-family: 'Inter', sans-serif;
                transition: background-color 0.3s ease;
                background-size: cover;
                background-position: center;
            }
            .dark {
                background-color: #121212;
                color: #ffffff;
                background-image: url('/Listenly/Scr/frontend/Pages/Img/bg_dark.jpg');
            }
            .light {
                background-color: #f0f0f0;
                color: #1e1e1e;
                background-image: url('/Listenly/Scr/frontend/Pages/Img/bg_light.jpg');
            }
            .profile-card {
                background-color: rgba(30, 30, 30, 0.8); /* Fundo semi-transparente para o tema escuro */
                backdrop-filter: blur(8px); /* Efeito de desfoque para o tema escuro */
                border: 1px solid #333;
                transition: background-color 0.3s ease, border 0.3s ease;
            }
            .dark .profile-card {
                background-color: rgba(30, 30, 30, 0.8);
                border: 1px solid #333;
            }
            .light .profile-card {
                background-color: rgba(255, 255, 255, 0.8); /* Fundo semi-transparente para o tema claro */
                border: 1px solid #ddd;
                backdrop-filter: blur(8px);
            }
            .data-item {
                border-bottom: 1px solid #333;
                transition: border-color 0.3s ease;
            }
            .light .data-item {
                border-color: #ddd;
            }
            .profile-card p, .profile-card h1, .profile-card h2 {
                transition: color 0.3s ease;
            }
            .light .profile-card p, .light .profile-card h1, .light .profile-card h2 {
                color: #1e1e1e;
            }
            .light .profile-card p.text-gray-400 {
                color: #666;
            }
            /* Estilos do modal de edição */
            .modal {
                background-color: rgba(0, 0, 0, 0.7);
                backdrop-filter: blur(5px);
                z-index: 100;
            }
            .modal-content {
                animation: slide-up 0.3s ease-out forwards;
            }
            @keyframes slide-up {
                from { transform: translateY(100%); opacity: 0; }
                to { transform: translateY(0); opacity: 1; }
            }
        </style>
    </head>
    <body class="flex flex-col items-center justify-center min-h-screen p-4 dark">

        <!-- Container do cabeçalho com botões -->
        <div class="fixed top-0 right-0 p-4 flex gap-4 z-50">
            <!-- Botão de tema -->
            <button id="theme-toggle" class="p-2 rounded-full shadow-lg transition-colors duration-300 dark:bg-gray-700 dark:hover:bg-gray-600 light:bg-gray-300 light:hover:bg-gray-400">
                <!-- Ícone do sol (exibido no modo claro) -->
                <svg id="sun-icon" class="w-6 h-6 text-yellow-500 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.536 6.536l-.707-.707M6.172 6.172l-.707-.707m10.607 10.607l-.707.707m-10.607-.707l-.707.707M12 18a6 6 0 100-12 6 6 0 000 12z"></path>
                </svg>
                <!-- Ícone da lua (exibido no modo escuro) -->
                <svg id="moon-icon" class="w-6 h-6 text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M17.293 13.53a.5.5 0 010 .707l-2.828 2.828a.5.5 0 01-.707 0L12.5 15.586l-2.586 2.587a.5.5 0 01-.707 0L7 15.586l-2.586 2.587a.5.5 0 01-.707 0L2.5 15.586l-2.586 2.587a.5.5 0 01-.707 0L.5 15.586l-2.586-2.587a.5.5 0 010-.707L.5 12.5l2.586-2.586a.5.5 0 01.707 0l2.586 2.586a.5.5 0 010 .707l-2.586 2.586a.5.5 0 01-.707 0L2.5 12.5l2.586 2.587a.5.5 0 010 .707L2.5 15.586l2.586 2.587a.5.5 0 010-.707L2.5 12.5l2.586-2.586a.5.5 0 01.707 0L7 12.5l2.586-2.586a.5.5 0 01.707 0l2.586 2.586a.5.5 0 010 .707L12.5 15.586l2.586-2.587a.5.5 0 01.707 0zM15 10a5 5 01-5-5a.5.5 0 011 0z" fill="currentColor"></path>
                </svg>
            </button>
            <!-- Botão de edição -->
            <button id="edit-button" class="px-4 py-2 rounded-full shadow-lg transition-colors duration-300 bg-pink-500 text-white hover:bg-pink-600">
                Editar Perfil
            </button>
        </div>

        <!-- Container principal do perfil de usuário -->
        <div class="profile-card max-w-2xl w-full mx-auto rounded-3xl shadow-2xl p-6 sm:p-10 transform hover:scale-105 transition-transform duration-300 ease-in-out">
            
            <!-- Título da página de perfil -->
            <h1 class="text-3xl sm:text-4xl font-bold text-center mb-8 sm:mb-12 text-pink-500">Perfil do Usuário</h1>

            <!-- Seção da foto de perfil -->
            <div class="flex flex-col items-center mb-8">
                <img id="profile-photo" src="https://placehold.co/150x150/4B4B4B/FFFFFF?text=Usuário" alt="Foto do Usuário" class="w-32 h-32 rounded-full border-4 border-pink-500 shadow-lg mb-4">
                <h2 id="username-display" class="text-2xl font-semibold">Nome de Usuário</h2>
                <p id="handle-display" class="text-gray-400">@usuario_musica</p>
            </div>

            <!-- Seção de informações pessoais com layout de grade -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-y-6 gap-x-8">

                <!-- Item de dados: Nome Completo -->
                <div class="data-item pb-4">
                    <p class="text-sm font-light text-gray-400 uppercase tracking-wide">Nome Completo</p>
                    <p id="full-name-display" class="text-lg mt-1 font-medium">Nome e Sobrenome</p>
                </div>

                <!-- Item de dados: Email -->
                <div class="data-item pb-4">
                    <p class="text-sm font-light text-gray-400 uppercase tracking-wide">Email</p>
                    <p id="email-display" class="text-lg mt-1 font-medium">email.usuario@exemplo.com</p>
                </div>

                <!-- Item de dados: Telefone -->
                <div class="data-item pb-4">
                    <p class="text-sm font-light text-gray-400 uppercase tracking-wide">Telefone</p>
                    <p id="phone-display" class="text-lg mt-1 font-medium">(11) 98765-4321</p>
                </div>

                <!-- Item de dados: Sexo -->
                <div class="data-item pb-4">
                    <p class="text-sm font-light text-gray-400 uppercase tracking-wide">Sexo</p>
                    <p id="gender-display" class="text-lg mt-1 font-medium">Não informado</p>
                </div>

                <!-- Item de dados: País/Região -->
                <div class="data-item pb-4">
                    <p class="text-sm font-light text-gray-400 uppercase tracking-wide">País/Região</p>
                    <p id="country-display" class="text-lg mt-1 font-medium">Brasil</p>
                </div>

                <!-- Item de dados: Data de Criação da Conta -->
                <div class="data-item pb-4">
                    <p class="text-sm font-light text-gray-400 uppercase tracking-wide">Membro desde</p>
                    <p id="join-date-display" class="text-lg mt-1 font-medium">1 de janeiro de 2024</p>
                </div>
                
            </div>
            
        </div>

        <!-- Modal de Edição de Perfil (escondido por padrão) -->
        <div id="edit-modal" class="modal fixed inset-0 flex items-center justify-center p-4 hidden">
            <div class="modal-content profile-card max-w-lg w-full rounded-3xl p-6 sm:p-8">
                <h2 class="text-2xl font-bold text-center mb-6 text-pink-500">Editar Perfil</h2>
                
                <form id="edit-form" class="space-y-4">
                    <div class="flex flex-col items-center mb-4">
                        <img id="modal-profile-photo" src="https://placehold.co/120x120/4B4B4B/FFFFFF?text=Usuário" alt="Nova foto" class="w-24 h-24 rounded-full border-2 border-pink-500 mb-2">
                        <!-- Opção de upload de foto -->
                        <label class="cursor-pointer text-sm text-pink-500 hover:text-pink-400 transition-colors">
                            Mudar Foto
                            <input type="file" class="hidden" id="photo-upload">
                        </label>
                    </div>
                
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label for="username" class="block text-sm font-medium text-gray-400">Nome de Usuário</label>
                            <input type="text" id="username" class="mt-1 block w-full rounded-md bg-gray-700 border-gray-600 text-white p-2 focus:ring-pink-500 focus:border-pink-500" required>
                        </div>
                        <div>
                            <label for="fullName" class="block text-sm font-medium text-gray-400">Nome Completo</label>
                            <input type="text" id="fullName" class="mt-1 block w-full rounded-md bg-gray-700 border-gray-600 text-white p-2 focus:ring-pink-500 focus:border-pink-500">
                        </div>
                        <div>
                            <label for="email" class="block text-sm font-medium text-gray-400">Email</label>
                            <input type="email" id="email" class="mt-1 block w-full rounded-md bg-gray-700 border-gray-600 text-white p-2 focus:ring-pink-500 focus:border-pink-500" required>
                        </div>
                        <div>
                            <label for="phone" class="block text-sm font-medium text-gray-400">Telefone</label>
                            <input type="tel" id="phone" class="mt-1 block w-full rounded-md bg-gray-700 border-gray-600 text-white p-2 focus:ring-pink-500 focus:border-pink-500">
                        </div>
                        <div>
                            <label for="gender" class="block text-sm font-medium text-gray-400">Sexo</label>
                            <select id="gender" class="mt-1 block w-full rounded-md bg-gray-700 border-gray-600 text-white p-2 focus:ring-pink-500 focus:border-pink-500">
                                <option value="male">Masculino</option>
                                <option value="female">Feminino</option>
                                <option value="not-specified" selected>Não informado</option>
                            </select>
                        </div>
                        <div>
                            <label for="country" class="block text-sm font-medium text-gray-400">País/Região</label>
                            <input type="text" id="country" class="mt-1 block w-full rounded-md bg-gray-700 border-gray-600 text-white p-2 focus:ring-pink-500 focus:border-pink-500">
                        </div>
                    </div>

                    <div class="flex justify-end space-x-4 pt-4">
                        <button type="button" id="cancel-edit" class="px-4 py-2 rounded-full font-semibold text-white bg-gray-600 hover:bg-gray-500 transition-colors">Cancelar</button>
                        <button type="submit" class="px-4 py-2 rounded-full font-semibold text-white bg-pink-600 hover:bg-pink-500 transition-colors">Salvar Alterações</button>
                    </div>
                </form>
            </div>
        </div>
        
        <script src="./perfil.js"></script>
        <script>
            const nomeUsuario = ""; // Pode vir do servidor ou localStorage, por exemplo

            // Atualiza o título da aba
            document.title = `Listenly - ${nomeUsuario}!`;
        </script>
    </body>
    </html>
