    <!DOCTYPE html>
    <html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <!-- Imports Css-->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="icon" href="/Listenly/Scr/frontend/Pages/Img/Icons/logo.png" type="image/png">
        <link rel="stylesheet" href="/Listenly/Scr/frontend/Pages/Login/login.css">
        
        <!-- Title Aba-->
        <title>Listenly - Login</title>

    </head>
    <body>

        <!-- Nav bar-->
        <div class="nav_bar">
            <div class="nav_container"></div>
            <a href="#" class="logo"></a>
                <nav>
                    <ul>
                        <li>
                            <ul class="nav-menu">
                                <li><a href="/Listenly/Public/index.html" class="nav-link">Home</a></li>
                                <li><a href="#" class="nav-link">Sobre</a></li>
                                <li><a href="#" class="nav-link">Serviços</a></li>
                                <li><a href="#" class="nav-link">Contato</a></li>
                            </ul>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>

        <!-- Formulario -->
        <div class="form_login">

            <h1>Login</h1>

            <form action="#" method="POST" onsubmit="return validarFormLogin(event)">
                <div class="box_form">
                    <input type="text" id="email" name="email" placeholder="Your email" required>
                    <i class="bi bi-envelope"></i>
                </div>

                <div class="box_form">
                    <input type="password" id="senha" name="senha" placeholder="Enter your password" required>
                    
                    <!-- botão com ícone -->
                    <button class="View" type="button" onclick="mostrarSenha()" style="border:none; background:none; cursor:pointer;">
                        <i id="iconeSenha" class="bi bi-lock"></i>
                    </button>
                </div>

                <!-- Botão de enviar-->
                <div class="Enviar">
                <button type="submit">TO ENTER</button>
                </div>

                <!-- Paragrafo/Redirecionamento de não ter conta-->
                <div class="link_register">
                    <p>Don't have an account? <a href="/Listenly/Scr/frontend/Pages/Criar_usuarios/criar_usuarios.html">Register</a></p>
                </div>

                <span id="Erro" style="color: red;"></span>
            </form>
        </div>


            <script src="/Listenly/Scr/backend/Js/login.js"></script>  <!-- Import Script.js-->
            
            <script>
                const nomeUsuario = ""; // Pode vir do servidor ou localStorage, por exemplo

                // Atualiza o título da aba
                document.title = `Listenly - ${nomeUsuario}!`;
            </script>
    </body>
    </html>
