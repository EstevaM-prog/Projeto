    <!DOCTYPE html>
    <html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Listenly - Login</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="icon" href="/Listenly/Scr/frontend/Pages/Img/Icons/logo.png" type="image/png">
        <link rel="stylesheet" href="/Listenly/Scr/frontend/Pages/Login/login.css">
        
    </head>
    <body>
        
        <div class="form_login">

            <h1>Login</h1>

            <form for="nome" action="#" method="post">
                <div class="box_form">
                    <input type="text" placeholder="Email" required>
                    <i class="bi bi-envelope"></i>
                </div>
                <div class="box_form">
                    <input type="password" placeholder="Senha" required>
                    <i class="bi bi-lock"></i>
                </div>

                <div class="box_lembrar_esqueci">
                    <label><input type="checkbox">Lembrar</label>
                    <a href="#">Esqueci senha</a>
                </div><br>

                <div class="Enviar">
                <button type="submit">Entrar</button>
                </div>

                <div class="link_register">
                    <p>Não tem conta? <a href="/Listenly/Scr/frontend/Pages/Criar_usuarios/criar_usuarios.html">Registrar</a></p>
                </div>
            </form>
        </div>

                <script type="module">
                    import { validar_formulario_login } from '/Listenly/Scr/Login/validar_form_login.js';

                    // Disponibiliza no escopo global para o formulário conseguir acessar
                    window.validarFormulario = validar_formulario_login;
                </script>

    </body>
    </html>
