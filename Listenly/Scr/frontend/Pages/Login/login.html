    <!DOCTYPE html>
    <html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <!-- Imports Css-->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="icon" href="/Listenly/Scr/frontend/Pages/Img/Icons/logo.png" type="image/png">
        <link rel="stylesheet" href="login.css">
        
        <!-- Title Aba-->
        <title>Listenly - Login</title>

    </head>
    <body>

        <!-- Nav bar-->
        <div class="nav_bar">
            <div class="nav_container"></div>
            <a href="#" class="logo"></a>
                <nav>
                    <ul>
                        <li>
                            <ul class="nav-menu">
                                <li><a href="/Listenly/Public/index.html" class="nav-link">Home</a></li>
                                <li><a href="#" class="nav-link">Sobre</a></li>
                                <li><a href="#" class="nav-link">Serviços</a></li>
                                <li><a href="#" class="nav-link">Contato</a></li>
                            </ul>
                        </li>
                    </ul>
                </nav>
            </div>

            <!-- Formulário atualizado com ID para JS e chamada de validação -->
            <form id="loginForm" method="POST" action="#">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="bi bi-envelope"></i></span>
                        <input 
                            type="text" 
                            id="email" 
                            name="email" 
                            placeholder="seu@email.com"
                        >
                    </div>
                </div>

                <div class="box_form">
                    <input type="password" id="senha" name="senha" placeholder="Enter your password" required>
                    
                    <!-- botão com ícone -->
                    <button class="View" type="button" onclick="mostrarSenha()" style="border:none; background:none; cursor:pointer;">
                        <i id="iconeSenha" class="bi bi-lock"></i>
                    </button>
                </div>

                <!-- Botão de enviar-->
                <div class="Enviar">
                <button type="submit">TO ENTER</button>
                </div>

                <!-- Container para mensagens de Erro/Sucesso -->
                <div id="mensagem"></div>

                <div class="form-options">
                    <div class="remember-me">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Lembrar-me</label>
                    </div>
                    <a href="../Sup/suporte.html" class="forgot-password">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="login-button">Entrar</button>
            </form>

            <div class="divider">ou continue com</div>

            <div class="social-login">
                <button class="social-button" onclick="alert('Login com Google')">
                    <span class="social-icon">🔵</span>
                    Google
                </button>
                
                <button class="social-button" onclick="alert('Login com Facebook')">
                    <span class="social-icon">📘</span>
                    Facebook
                </button>
            </div>

            <div class="signup-link">
                Não tem uma conta? <a href="../Criar_usuarios/criar_usuarios.html">Cadastre-se</a>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
