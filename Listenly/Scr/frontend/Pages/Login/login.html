<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Web Music</title>
    <!-- Importando Bootstrap Icons para funcionar a lógica do bi-lock/unlock -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <!-- Botão de Tema -->
    <button id="theme-toggle" class="theme-toggle" title="Alternar Tema">
        🌙
    </button>

    <div class="login-container">
        <!-- Left Side -->
        <div class="login-left">
            <div class="brand-logo">🎵</div>
            <h1 class="brand-title">Web Music</h1>
            <p class="brand-subtitle">Sua música, em qualquer lugar</p>
            <div class="welcome-illustration">🎧</div>
        </div>

        <!-- Right Side -->
        <div class="login-right">
            <div class="login-header">
                <h2>Bem-vindo de volta!</h2>
                <p>Entre com sua conta para continuar</p>
            </div>

            <!-- Formulário atualizado com ID para JS e chamada de validação -->
            <form id="loginForm" method="POST" action="#">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="bi bi-envelope"></i></span>
                        <input 
                            type="text" 
                            id="email" 
                            name="email" 
                            placeholder="seu@email.com"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <div class="input-wrapper">
                        <!-- Ícone de cadeado com ID iconeSenha para o Script -->
                        <span class="input-icon">
                            <i id="iconeSenha" class="bi bi-lock"></i>
                        </span>
                        
                        <!-- ID atualizado para 'senha' -->
                        <input 
                            type="password" 
                            id="senha" 
                            name="password" 
                            placeholder="••••••••••"
                        >
                        
                        <!-- Botão para mostrar senha -->
                        <button type="button" class="toggle-password-btn" onclick="mostrarSenha()">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Container para mensagens de Erro/Sucesso -->
                <div id="mensagem"></div>

                <div class="form-options">
                    <div class="remember-me">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Lembrar-me</label>
                    </div>
                    <a href="../Sup/suporte.html" class="forgot-password">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="login-button">Entrar</button>
            </form>

            <div class="divider">ou continue com</div>

            <div class="social-login">
                <button class="social-button" onclick="alert('Login com Google')">
                    <span class="social-icon">🔵</span>
                    Google
                </button>
                
                <button class="social-button" onclick="alert('Login com Facebook')">
                    <span class="social-icon">📘</span>
                    Facebook
                </button>
            </div>

            <div class="signup-link">
                Não tem uma conta? <a href="../Criar_usuarios/criar_usuarios.html">Cadastre-se</a>
            </div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
