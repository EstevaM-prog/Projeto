    <!DOCTYPE html>
    <html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Listenly - Login</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="icon" href="/Listenly/Scr/frontend/Pages/Img/Icons/logo.png" type="image/png">
        <link rel="stylesheet" href="/Listenly/Scr/frontend/Pages/Login/login.css">
        
    </head>
    <body>
        
        <div class="form_login">

            <h1>Login</h1>

            <form for="forms_login" action="#" method="post" onsubmit="validarFormLogin()">
                <div class="box_form">
                    <input type="text" id="email" name="email" placeholder="Email" required>
                    <i class="bi bi-envelope"></i>
                </div>

                <div class="box_form">
                    <input type="password" id="senha" name="senha" placeholder="Senha" required>
                    <i class="bi bi-lock"></i>
                </div>

                <div class="box_lembrar_esqueci">
                    <label><input type="checkbox">Lembrar</label>
                    <a href="#">Esqueci senha</a>
                </div><br>

                <div class="Enviar">
                <button type="submit">Entrar</button>
                </div>

                <div class="link_register">
                    <p>Não tem conta? <a href="/Listenly/Scr/frontend/Pages/Criar_usuarios/criar_usuarios.html">Registrar</a></p>
                </div>

                <p id="Erro" style="color: red;"></p>
            </form>
        </div>

                <script>
                    
                // Validar Login
                function validarFormLogin(event) {
                    event.preventDefault(); // evita envio automático

                    // Dados
                    const email = document.getElementById('email').value.trim();
                    const senha = document.getElementById('senha').value.treim();

                    
                    const regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/; // Regex para email válido
                    const regexSenha = /^(?=.*[a-zA-Z])(?=.*[\d\W_]).{10,}$/; // Regex para senha: mínimo 8 caracteres, pelo menos 1 letra e 1 número ou caractere especial

                    // Alert de erro
                    const erro = document.getElementById("Erro");

                    if (email === "" || senha === ""){
                    erro.textContent = "❌ Por favor, preencha todos os campos.";
                    } else if (!regexEmail.test(email)) {
                    event.preventDefault();
                    erro.textContent = "❌ Insira um e-mail válido.";
                    } else if (!regexSenha.test(senha)) {
                    event.preventDefault();
                    erro.textContent = "❌ A senha deve ter pelo menos 10 caracteres, incluindo letras e números ou caractere especial.";
                    } else {
                    erro.textContent = "";
                    alert("✅ Login válido! (simulação)");
                    }
                };


                </script>
                    
    </body>
    </html>
