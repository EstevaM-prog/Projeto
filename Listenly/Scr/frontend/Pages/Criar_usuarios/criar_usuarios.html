    <!doctype html>
    <html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login - Listenly</title>
        <link rel="stylesheet" href="/Listenly/Scr/frontend/Pages/Criar_usuarios/criar_usuarios.css">
        <link rel="icon" href="/Listenly/Scr/frontend/Pages/Img/Icons/logo.png" type="image/png">
    </head>
    <body>

        <div class="container">
            <div class="form_criar_usuario">
                <h1>Cadastro de usuário</h1>

                <form id="formCadastro" action="#" method="post">

                <label for="nome">Digite Seu Nome Compelto:</label><br>
                <input type="text" id="nome" name="nome" required><br><br>


                <label for="email">Digite Seu E-mail:</label><br>
                <input type="email" id="email" name="email" required><br><br>


                <label for="username">Digite Seu Username:</label><br>
                <input type="text" id="username" name="username" required><br><br>


                <label for="senha">Digite Sua Senha:</label><br>
                <input type="password" id="senha" name="senha" required><br><br>


                <label for="senha2">Confirme Sua Senha:</label><br>
                <input type="password" id="senha2" name="senha2" required><br><br>

                <span id="mensagem"></span><br><br>

                <input type="submit" value="Cadastrar">
                </form>
            </div>
        </div>

        <script type="module">
            // Import
            import { validarFormCreateUser } from './Listenly/Scr/Criar_usuarios/validar_form_criarusuario.js';
            import { confirmar_senha } from './Listenly/Scr/Criar_usuarios/confirm_senha.js';

            const form = document.getElementById('formCadastro');

            form.addEventListener('submit', (event) => {
                // 1) validações gerais
                const formOk = validarFormCreateUser(); // deve retornar true/false
                if (!formOk) {
                event.preventDefault();
                return;
                }

                // 2) confirmação de senha
                const senhaOk = confirmar_senha(); // deve retornar true/false
                if (!senhaOk) {
                event.preventDefault();
                return;
                }

                // 3) tudo certo
                alert('✅ Cadastro válido! (simulação)');
                
            });
        </script>

    </body>
    </html>
