    <!doctype html>
    <html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Listenly - Register</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="/Listenly/Scr/frontend/Pages/Criar_usuarios/criar_usuarios.css">
        <link rel="icon" href="/Listenly/Scr/frontend/Pages/Img/Icons/logo.png" type="image/png">
    </head>
    <body>
        
        <div class="form_register">

            <h1>Register</h1>

            <form action="#" method="post" onsubmit="return validarFormCreateUser(event)">
                <div class="box_register">
                    <input type="text" id="email" name="email" placeholder="Enter your email" required>
                    <i class="bi bi-envelope"></i>
                </div>

                <div class="box_register">
                    <input type="text" id="username" name="username" placeholder="Enter your username" required>
                    <i class="bi bi-person"></i>
                </div>

                <div class="box_register">
                    <input type="password" id="senha" name="senha" placeholder="Enter your password" required>
                    
                    <!-- botão com ícone -->
                    <button class="View" type="button" onclick="mostrarSenha()" style="border:none; background:none; cursor:pointer;">
                        <i id="iconeSenha" class="bi bi-eye"></i>
                    </button>
                </div>

                <div class="box_register">
                    <input type="password" id="senha2" name="senha2" placeholder="Enter your password" required>
                    
                    <!-- botão com ícone -->
                    <button class="View" type="button" onclick="mostrarSenha2()" style="border:none; background:none; cursor:pointer;">
                        <i id="iconeSenha2" class="bi bi-eye"></i>
                    </button>
                </div>

                <div class="Enviar">
                    <button type="submit">TO ENTER</button>
                </div>

            </form>
        </div>
        
        <script src="./mostrar_senha.js"></script>
        <script src="./validar_form_criarusuario.js"></script>
    </body>
    </html>
