<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Web Music</title>
    <!-- Importando Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="criar_usuarios.css">
</head>
<body>
    <!-- Botão de Tema -->
    <button id="theme-toggle" class="theme-toggle" title="Alternar Tema">
        🌙
    </button>

    <div class="login-container">
        <!-- Left Side (Mantido igual) -->
        <div class="login-left">
            <div class="brand-logo">🎵</div>
            <h1 class="brand-title">Web Music</h1>
            <p class="brand-subtitle">Junte-se à comunidade</p>
            <div class="welcome-illustration">🎸</div>
        </div>

        <!-- Right Side - Form Cadastro -->
        <div class="login-right">
            <div class="login-header">
                <h2>Criar Conta</h2>
                <p>Preencha os dados abaixo para começar</p>
            </div>

            <form id="cadastroForm" action="#" method="POST">
                <!-- Campo: Nome de Usuário -->
                <div class="form-group">
                    <label for="username">Nome de Usuário</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="bi bi-person"></i></span>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            placeholder="SeuNomeDeUsuario"
                        >
                    </div>
                </div>

                <!-- Campo: Email -->
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <div class="input-wrapper">
                        <span class="input-icon"><i class="bi bi-envelope"></i></span>
                        <input 
                            type="text" 
                            id="email" 
                            name="email" 
                            placeholder="seu@email.com"
                        >
                    </div>
                </div>

                <!-- Campo: Senha -->
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <i id="iconeSenha" class="bi bi-lock"></i>
                        </span>
                        <input 
                            type="password" 
                            id="senha" 
                            name="password" 
                            placeholder="Mínimo 10 caracteres"
                        >
                        <button type="button" class="toggle-password-btn" onclick="mostrarSenha('senha', 'iconeSenha')">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Campo: Senha 2 (Confirmação) -->
                <div class="form-group">
                    <label for="senha2">Confirmar Senha</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <i id="iconeSenha2" class="bi bi-shield-lock"></i>
                        </span>
                        <input 
                            type="password" 
                            id="senha2" 
                            name="confirm_password" 
                            placeholder="Repita a senha"
                        >
                        <button type="button" class="toggle-password-btn" onclick="mostrarSenha('senha2', 'iconeSenha2')">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Mensagens -->
                <div id="mensagem"></div>

                <!-- Termos (Equivalente visual ao Lembrar-me) -->
                <div class="form-options">
                    <div class="remember-me">
                        <!-- ID 'termos' usado para o evento de clique -->
                        <input type="checkbox" id="termos" name="termos">
                        <label for="termos">Aceito os termos</label>
                    </div>
                </div>

                <button type="submit" class="login-button">Cadastrar</button>
            </form>

            <div class="divider">ou cadastre-se com</div>

            <div class="social-login">
                <button class="social-button" onclick="alert('Login com Google')">
                    <span class="social-icon">🔵</span>
                    Google
                </button>
                <button class="social-button" onclick="alert('Login com Facebook')">
                    <span class="social-icon">📘</span>
                    Facebook
                </button>
            </div>

            <div class="signup-link">
                Já tem uma conta? <a href="/Listenly/Scr/frontend/Pages/Login/login.html">Entrar</a>
            </div>
        </div>
    </div>
   
        <script src="/Listenly/Scr/backend/Js/create_user.js"></script>
        <script>
            document.getElementById('form_register').addEventListener('submit', async (e) => {
                e.preventDefault();
                const username = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                // EXEMPLO: enviar para o servidor para criar conta (recomendado)
                try {
                    const resp = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                    });

                    if (!resp.ok) throw new Error('Erro no registro');

                    const data = await resp.json(); // por exemplo: { success: true, token: 'abc123' }

                    // SALVE apenas um token (nunca a senha) no cookie se necessário
                    // Preferência de segurança: preferir que o servidor crie um cookie HttpOnly (ver abaixo).
                    setCookie('session_token', data.token, 7); // expira em 7 dias
                    setCookie('username', username, 7);

                    alert('Registro realizado com sucesso!');
                    window.location.href = '/Pages/Home/home.html'; // redireciona
                } catch (err) {
                    console.error(err);
                    alert('Erro ao registrar: ' + err.message);
                }
                });
        </script>
    
    </body>
    </html>
