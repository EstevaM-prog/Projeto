    <!doctype html>
    <html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Listenly - Register</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
        <link rel="stylesheet" href="/Listenly/Scr/frontend/Pages/Criar_usuarios/criar_usuarios.css">
        <link rel="icon" href="/Listenly/Scr/frontend/Pages/Img/Icons/logo.png" type="image/png">
    </head>
    <body>
        
        <div class="form_register">

            <h1>Register</h1>

            <form for="" action="#" method="post">
                <div class="box_register">
                    <input type="text" id="email" name="email" placeholder="Enter your email" required>
                    <i class="bi bi-envelope"></i>
                </div>

                <div class="box_register">
                    <input type="text" id="username" name="username" placeholder="Enter your username" required>
                    <i class="bi bi-person"></i>
                </div>

                <div class="box_register">
                    <input type="password" id="senha" name="senha" placeholder="Enter your password" required>
                    
                    <!-- botão com ícone -->
                    <button class="View" type="button" onclick="mostrarSenha()" style="border:none; background:none; cursor:pointer;">
                        <i id="iconeSenha" class="bi bi-lock"></i>
                    </button>
                </div>

                <div class="box_register">
                    <input type="password" id="senha2" name="senha2" placeholder="Enter your password" required>
                    
                    <!-- botão com ícone -->
                    <button class="View" type="button" onclick="mostrarSenha2()" style="border:none; background:none; cursor:pointer;">
                        <i id="iconeSenha" class="bi bi-lock"></i>
                    </button>
                </div>

<!--
                <div class="box_register">
                    <input type="text" id="senha2" name="senha2" placeholder="Confirme your password" required>
                    <i id="iconeSenha" class="bi bi-lock"></i>
                </div>
-->
                <div class="Enviar">
                    <button type="submit">TO ENTER</button>
                </div>

            </form>
        </div>
        
        <script>
            function mostrarSenha(){
                const senha = document.getElementById("senha");

                if (senha.type === "password") {
                    senha.type = "text";
                    // icon icone.classList.replace("bi-lock", "bi-unlock")
                } else {
                    senha.type = "password";
                }
            }

            function mostrarSenha2(){
                const senha2 = document.getElementById("senha2");

                if (senha2.type === "password") {
                    senha2.type = "text";
                    // icon icone.classList.replace("bi-lock", "bi-unlock")
                } else {
                    senha2.type = "password";
                }
            }
        </script>
    </body>
    </html>
