<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Tocar Musica -->
                <audio id="statusMusic">
                    <source src="/groovy-vibe-427121.mp3" type="audio/mpeg">
                </audio>

                <button id="btnPlayPause">Tocar</button>

    <script>
        // 1. Selecionar TODOS os elementos primeiro
const statusMusic = document.getElementById('statusMusic'); // <-- Problema 2 corrigido
const playBtn = document.getElementById('play');
const pauseBtn = document.getElementById('pause');

// 2. Anexar o evento de 'play'
playBtn.addEventListener('click', () => { // <-- Problema 1 corrigido ('click')
    statusMusic.play();
});

// 3. Anexar o evento de 'pause'
pauseBtn.addEventListener('click', () => { // <-- Problema 1 corrigido ('click')
    statusMusic.pause();
});

// Não precisamos daquele if/else aqui.
// As funções playMusica() e pauseMusic() também não eram necessárias,
// podemos anexar os eventos diretamente.
    </script>
</body>
</html>
