<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Suporte ao Cliente</title>
    <style>
        body { font-family: Arial; margin: 40px; background: #f4f4f4; }
        #chat { border: 1px solid #ccc; background: white; height: 300px; overflow-y: scroll; padding: 10px; }
        input, button { padding: 10px; margin-top: 10px; }
        button { cursor: pointer; }
    </style>
</head>
<body>
    <h2>Chat de Suporte</h2>
    <div id="chat"></div>
    <input id="nome" placeholder="Seu nome">
    <input id="mensagem" placeholder="Digite uma mensagem">
    <button onclick="enviar()">Enviar</button>

    <script>
        const chat = document.getElementById("chat");
        const ws = new WebSocket("ws://localhost:8081");

        ws.onmessage = (event) => {
            const msg = JSON.parse(event.data);
            chat.innerHTML += `<p><strong>${msg.nome}:</strong> ${msg.texto}</p>`;
            chat.scrollTop = chat.scrollHeight;
        };

        function enviar() {
            const nome = document.getElementById("nome").value;
            const texto = document.getElementById("mensagem").value;
            if (nome && texto) {
                ws.send(JSON.stringify({ nome, texto }));
                document.getElementById("mensagem").value = "";
            }
        }
    </script>
</body>
</html>
